global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: totaltech_api
    metrics_path: /metrics
    static_configs:
      - targets: [localhost:5070]

  - job_name: totaltech_frontend
    metrics_path: /metrics
    static_configs:
      - targets: [localhost:5087]
