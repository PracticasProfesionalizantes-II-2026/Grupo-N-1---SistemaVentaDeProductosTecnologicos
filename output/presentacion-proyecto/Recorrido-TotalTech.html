manoPagina,\n    IProductosLogica logica, CancellationToken cancellationToken) =>\n{\n    var filtro = new FiltroCatalogoProductos\n    {\n        Texto = texto, IdCategoria = idCategoria, PrecioMin = precioMin, PrecioMax = precioMax,"},{"path":"Totaltech/Repositorios/ProductosRepositorio.cs:115","code":"var totalItems = await consulta.CountAsync(cancellationToken);\nvar items = await consulta\n    .OrderBy(producto => producto.Nombre)\n    .ThenBy(producto => producto.IdProducto)\n    .Skip((filtro.Pagina - 1) * filtro.TamanoPagina)\n    .Take(filtro.TamanoPagina)\n    .Select(producto => new ProductoCatalogoResponse"},{"path":"Totaltech/Repositorios/ProductosRepositorio.cs:136","code":"return new CatalogoProductosResponse\n{\n    Items = items,\n    Pagina = filtro.Pagina,\n    TamanoPagina = filtro.TamanoPagina,\n    TotalItems = totalItems,\n    TotalPaginas = totalItems == 0 ? 0 : (int)Math.Ceiling(totalItems / (double)filtro.TamanoPagina)"}]},{"id":"carrito","name":"Carrito propio","ref":"RF3 / API actual","docs":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",5],["Documentacion/Documentación de API.pdf",9]],"actor":"Cliente autenticado","view":"Frontend/Views/Carrito/Index.cshtml; Frontend/Views/Productos/Detalle.cshtml","mvc":"Frontend/Controllers/CarritoController.cs","service":"Frontend/Services/CarritosApiService.cs","endpoint":"GET /carritos/actual; POST /carritos/actual/productos; PATCH y DELETE /carritos/actual/productos/{idProducto}","endpointFile":"Totaltech/Endpoints/CarritosEndpoints.cs","logic":"Totaltech/Logica/CarritosLogica.cs","repo":"Totaltech/Datos/TotaltechDbContext.cs","methods":"CarritoController.Agregar / ActualizarCantidad / Eliminar; CarritosApiService.EnviarAsync; CarritosLogica.ModificarCarritoActivoAsync / CrearResumenAsync","result":"200: resumen actualizado. Stock insuficiente: 409. Cantidad inválida: 400.","rule":"El usuario se obtiene del JWT. Precio y total se calculan en 003c/button>\n\u003c/form>\n\u003cp class=\"carrito__subtotal\">Subtotal: \u003cstrong>$ @item.Subtotal.ToString(\"N2\")\u003c/strong>\u003c/p>"},{"path":"Frontend/Controllers/CarritoController.cs:25","code":"public async Task\u003cIActionResult> Agregar(int idProducto, int cantidad = 1, string? returnUrl = null, CancellationToken cancellationToken = default)\n{\n    var resultado = await EjecutarAsync(() => _carritos.AgregarAsync(idProducto, cantidad, cancellationToken));\n    if (!resultado.Exitoso) return Volver(returnUrl, idProducto, resultado.Error);\n    TempData[\"Mensaje\"] = \"Producto agregado al carrito.\";\n    return RedirectToAction(nameof(Index));\n}"},{"path":"Totaltech/Endpoints/CarritosEndpoints.cs:16","code":"group.MapGet(\"/actual\", async (ICarritosLogica logica, ClaimsPrincipal usuarioActual,\n    CancellationToken cancellationToken) =>\n{\n    var idUsuario = usuarioActual.ObtenerIdUsuario();\n    return !idUsuario.HasValue\n        ? Results.Unauthorized()\n        : Results.Ok(await logica.ObtenerResumenActivoAsync(idUsuario.Value, cancellationToken));"},{"path":"Totaltech/Logica/CarritosLogica.cs:357","code":"    detalle.Cantidad = cantidadFinal;\n    detalle.PrecioUnitario = producto.Precio;\n    detalle.Subtotal = producto.Precio * cantidadFinal;\n    await _context.SaveChangesAsync(cancellationToken);\n    if (transaccion is not null) await transaccion.CommitAsync(cancellationToken);\n    return (await CrearResumenAsync(carrito.IdCarrito, cancellationToken), null, false);\n}"},{"path":"Frontend/Controllers/CarritoController.cs:16","code":"public async Task\u003cIActionResult> Index(CancellationToken cancellationToken)\n{\n    try { return View(CarritoViewModel.Desde(await _carritos.ObtenerActualAsync(cancellationToken))); }\n    catch (HttpRequestException) { TempData[\"Error\"] = \"No pudimos cargar el carrito. Intentá nuevamente.\"; }\n    catch (TaskCanceledException) when (!cancellationToken.IsCancellationRequested) { TempData[\"Error\"] = \"El carrito tardó demasiado en responder. Intentá nuevamente.\"; }\n    return View(new CarritoViewModel());\n}"}]},{"id":"productos","name":"Administración de productos","ref":"RF1 / UC-19","docs":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",3],["Documentacion/Casos de Uso- Totaltech.pdf",5],["Documentacion/Documentación de API.pdf",7],["Documentacion/Documentación de API.pdf",8]],"actor":"Administrador","view":"Frontend/Views/Productos/Crear.cshtml; Frontend/Views/Productos/Editar.cshtml","mvc":"Frontend/Controllers/ProductosController.cs","service":"Frontend/Services/ProductosApiService.cs; Frontend/Services/ProductoImagenStorage.cs","endpoint":"POST /productos; PUT /productos/{id}; DELETE /productos/{id}","endpointFile":"Totaltech/Endpoints/ProductosEndpoints.cs","logic":"Totaltech/Logica/ProductosLogica.cs","repo":"Totaltech/Repositorios/ProductosRepositorio.cs","methods":"ProductosController.Crear / Editar / Eliminar; ProductoImagenStorage.GuardarAsync; ProductosLogica.CrearAsync / ActualizarAsync / EliminarAsync","result":"Creación 201; edición 200; eliminación sin relaciones 204, con relaciones 409.","rule":"Solo administrador. Archivo válido hasta 5 MB; SQL guarda su URL. El borrado actual es físico con control de relaciones.","testFile":"Tests/Totaltech.IntegrationTests/E2E/CatalogoAdministracionE2ETests.cs","test":"Imagen_SePrevisualizaReemplazaYConservaTrasRenombrarYReiniciar; Eliminar_ProductoAsociadoAUnCarritoSeConservaYMuestraElMotivo","demo":["0–25 s: crear Notebook exposición TotalTech con categoría y proveedor válidos.","25–50 s: editar stock de 5 a 7 y elegir una imagen PNG válida.","50–60 s: guardar y verificar el resultado.","60–70 s: eliminar el producto de demostración sin relaciones."],"steps":[["Documento","RF1, Productos; UC-19, ABM.","Requisitos p. 8; casos de uso pp. 3 y 5. La baja lógica prevista difiere del borrado actual."],["Pantalla","Productos/Crear.cshtml y Editar.cshtml","Administrador completa precio, stock, categoría y proveedor. Editar admite archivo de imagen."],["Controlador","ProductosController + ProductoImagenStorage","Validación MVC y CSRF. GuardarAsync comprueba extensión, MIME, firma y tamaño, y guarda el archivo local."],["API","ProductosApiService → ProductosEndpoints","POST crea, PUT actualiza, DELETE elimina. Endpoint y lógica comprueban permisos y relaciones."],["Persistencia","ProductosLogica → ProductosRepositorio","EF Core guarda el producto y la URL de imagen en SQL Server. El archivo queda en wwwroot/uploads/productos."],["Respuesta","201 / 200 / 204 / 409 → mensaje MVC","Vuelve al catálogo con confirmación. Sin nueva imagen se conserva la anterior. Las relaciones bloquean la eliminación."]],"sources":[{"path":"Documentacion/Documentación - Grupo 1 -TotalTech.pdf p. 8; Documentacion/Casos de Uso- Totaltech.pdf p. 3; Documentacion/Casos de Uso- Totaltech.pdf p. 5; Documentacion/Documentación de API.pdf p. 7; Documentacion/Documentación de API.pdf p. 8","code":""},{"path":"Frontend/Views/Productos/Editar.cshtml:19","code":"\u003cform asp-action=\"Editar\" asp-route-id=\"@Model.IdProducto\" method=\"post\" enctype=\"multipart/form-data\" class=\"admin-form admin-panel\">\n    @Html.AntiForgeryToken()\n    \u003cinput asp-for=\"ReturnUrl\" type=\"hidden\" />\n    \u003cdiv asp-validation-summary=\"ModelOnly\" class=\"text-danger\">\u003c/div>\n    \u003clabel asp-for=\"Nombre\">\u003c/label>\n    \u003cinput asp-for=\"Nombre\" class=\"form-control\" />\n    \u003cspan asp-validation-for=\"Nombre\" class=\"text-danger\">\u003c/span>"},{"path":"Frontend/Services/ProductoImagenStorage.cs:16","code":"public async Task\u003c(string? ImagenUrl, string? Error)> GuardarAsync(\n    IFormFile archivo,\n    CancellationToken cancellationToken = default)\n{\n    if (archivo.Length == 0)\n        return (null, \"Seleccioná una imagen que no esté vacía.\");\n"},{"path":"Totaltech/Endpoints/ProductosEndpoints.cs:42","code":"group.MapPost(\"/\", async (ProductoRequest request, IProductosLogica logica) =>\n{\n    var producto = request.ToEntity();\n    var error = await logica.CrearAsync(producto);\n    if (error is not null)\n    {\n        return Results.BadRequest(error);"},{"path":"Totaltech/Repositorios/ProductosRepositorio.cs:55","code":"public async Task ActualizarAsync(Producto producto)\n{\n    _context.Productos.Update(producto);\n    await _context.SaveChangesAsync();\n}\n\npublic async Task EliminarAsync(Producto producto)"},{"path":"Frontend/Controllers/ProductosController.cs:223","code":"public async Task\u003cIActionResult> Eliminar(int id, string? returnUrl)\n{\n    try\n    {\n        using var response = await _productosApiService.EliminarAsync(id);\n        if (response.IsSuccessStatusCode)\n            TempData[\"Mensaje\"] = \"Producto eliminado correctamente.\";"}]}],"slides":[{"title":"TotalTech","say":"Somos Facundo Sola y Daiana Chinellato. Presentamos TotalTech, un sistema de venta de productos tecnológicos. Vamos a mostrar el problema que aborda, el alcance disponible y cómo una acción del usuario llega al código y vuelve a la pantalla. Seguiremos a un cliente que prepara su compra y al administrador que mantiene el catálogo.","transition":"Daiana presenta el problema que dio origen al proyecto.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",3]],"cue":"Presentar equipo y objetivo. No enumerar tecnologías todavía.","presenter":"Facundo","seconds":30,"start":0,"end":30,"number":1},{"title":"El problema de la operación comercial","say":"La documentación describe una operación con herramientas dispersas y tareas manuales. Esa situación provoca demoras, errores en la disponibilidad de stock y dificultades para seguir las ventas. TotalTech propone centralizar la información y los procesos comerciales. El objetivo de negocio es que el cliente encuentre información clara y que la administración mantenga los productos desde un mismo sistema. Estos problemas provienen del diagnóstico documental; no son mediciones de impacto obtenidas después de implantar el proyecto.","transition":"Facundo conecta ese problema con las personas que usan la solución.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",3],["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",4],["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",5]],"cue":"Relacionar cada problema con su consecuencia. No inventar porcentajes de mejora.","presenter":"Daiana","seconds":45,"start":30,"end":75,"number":2},{"title":"Los usuarios de TotalTech","say":"Para explicar esta entrega elegimos dos actores. El cliente quiere encontrar un producto, conocer su disponibilidad y organizar lo que desea comprar. El administrador necesita mantener precio, stock e imágenes. Usaremos un cliente ficticio que busca una notebook y un administrador que incorpora un producto para la exposición. Sus recorridos se encuentran en el catálogo: lo que administra uno es lo que consulta el otro. La documentación incluye otros interesados, pero estos dos actores permiten mostrar las capacidades elegidas en veinte minutos.","transition":"Daiana delimita qué parte de esa visión está disponible hoy.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",6],["Documentacion/Casos de Uso- Totaltech.pdf",2],["Documentacion/Casos de Uso- Totaltech.pdf",3]],"cue":"Señalar los dos recorridos. No afirmar que solo existen dos roles documentados.","presenter":"Facundo","seconds":45,"start":75,"end":120,"number":3},{"title":"Visión y alcance de la entrega","say":"La visión original abarca comercio electrónico, pedidos, pagos y atención al cliente. La entrega que mostraremos permite registrarse, iniciar sesión, consultar el catálogo, gestionar un carrito propio y administrar productos. Para delimitar el alcance contrastamos tres fuentes: requisitos, casos de uso y documentación actual de API. Después seguimos sus rutas en el código. Un endpoint existente no demuestra por sí solo que el recorrido desde una pantalla esté completo. Por eso el checkout MVC, la recuperación integral de contraseña y el envío desde contacto o garantía aparecen como pendientes. Esta separación permite evaluar lo entregado con evidencia concreta.","transition":"Facundo muestra el listado de capacidades y su referencia oficial.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",7],["Documentacion/Documentación de API.pdf",3],["Documentacion/Documentación de API.pdf",35],["Documentacion/Documentación de API.pdf",36]],"cue":"Distinguir visión, entrega y pendientes sin recorrer todos los módulos.","presenter":"Daiana","seconds":60,"start":120,"end":180,"number":4},{"title":"Cinco capacidades implementadas","say":"Esta tabla reúne los cinco requerimientos funcionales concretos de la exposición. Registro e inicio de sesión provienen de RF5, gestión de usuarios, y se relacionan con UC-01 y UC-02. Catálogo y detalle pertenecen a RF2 y combinan explorar, buscar y consultar, identificados como UC-07, UC-08 y UC-09. El carrito se apoya en RF3 y en la API actual. La administración de productos corresponde a RF1 y UC-19. No estamos cambiando la numeración oficial: seleccionamos capacidades dentro de esos grupos. Hay una diferencia documental relevante: el listado histórico de casos de uso plantea checkout sin carrito, mientras que los requisitos y el código actual sí incluyen carrito. La presentación conserva esa diferencia y explica el comportamiento vigente.","transition":"Daiana inicia el recorrido del cliente con el registro.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",2],["Documentacion/Casos de Uso- Totaltech.pdf",3],["Documentacion/Casos de Uso- Totaltech.pdf",5],["Documentacion/Documentación de API.pdf",9]],"cue":"Leer los cinco escenarios y explicar brevemente la discrepancia del carrito.","presenter":"Facundo","seconds":75,"start":180,"end":255,"number":5},{"title":"Registro de clientes","case":0,"say":"El registro responde a RF5 y UC-01. La vista Register.cshtml envía los datos a HomeController.Register. MVC valida el formulario y normaliza el email; luego utiliza IHttpClientFactory para enviar POST auth/registro. El endpoint convierte el contrato recibido y llama a UsuariosLogica.RegistrarAsync. Allí se fija el rol Cliente. CrearAsync verifica el duplicado, valida la contraseña y genera su hash. UsuariosRepositorio guarda el usuario mediante Entity Framework en SQL Server. El endpoint devuelve un usuario público con estado 201 y MVC redirige a Login. Si el email ya existe, la API responde 409 y el controlador lo convierte en un mensaje junto al campo. La contraseña no se devuelve en la respuesta. La prueba de registro con rol administrativo comprueba que el servidor fuerza Cliente.","transition":"La cuenta ya existe. Facundo explica cómo se inicia y se conserva la sesión.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",2],["Documentacion/Documentación de API.pdf",7]],"cue":"30 s de demostración. 60 s de explicación. Sin captura de registro: usar el diagrama como respaldo.","presenter":"Daiana","seconds":90,"start":255,"end":345,"number":6},{"title":"Inicio de sesión y permisos","case":1,"say":"Login.cshtml envía las credenciales a HomeController.Login. De nuevo se usa IHttpClientFactory para llamar a auth/login. La API busca el usuario y UsuariosLogica verifica el hash. Con credenciales válidas, JwtTokenService emite el token. El JSON vuelve al controlador con los datos públicos y el vencimiento. MVC crea los claims, guarda access_token en las propiedades de autenticación y ejecuta SignInAsync. Así se crea la cookie Totaltech.Auth para navegar por el sitio. Para las llamadas posteriores, ApiBearerTokenHandler agrega el JWT como Bearer. La cookie y el token cumplen funciones diferentes. Una contraseña incorrecta produce 401; un email inexistente produce 404 y el frontend ofrece el registro. Los permisos administrativos se verifican también del lado servidor.","transition":"Con la sesión iniciada, Daiana muestra cómo encontrar un producto.","sources":[["Documentacion/Documentación de API.pdf",5],["Documentacion/Documentación de API.pdf",7],["Documentacion/Casos de Uso- Totaltech.pdf",2]],"cue":"30 s de demostración y 60 s de código. Nunca mostrar tokens o contraseñas.","presenter":"Facundo","seconds":90,"start":345,"end":435,"number":7},{"title":"Catálogo y detalle del producto","case":2,"say":"El catálogo reúne los casos de explorar, buscar y consultar detalle. La vista envía texto, categoría, precios y disponibilidad por query string. ProductosController.Index solicita categorías y catálogo en paralelo mediante Task.WhenAll. ProductosApiService construye GET productos/catalogo y deserializa la respuesta. El endpoint crea el filtro; la lógica valida sus límites y el repositorio construye la consulta. AsNoTracking evita seguimiento de entidades en esta lectura. Where aplica los filtros. Count obtiene el total y el orden por nombre e identificador hace estable la paginación. Skip y Take seleccionan la página; Select devuelve solo los campos del contrato. SQL Server ejecuta esa consulta. El JSON contiene Items y totales. MVC arma CatalogoViewModel y Razor muestra las tarjetas. El detalle consulta el producto por identificador. Una búsqueda vacía tiene mensaje y opción de limpiar filtros; un identificador inexistente produce 404. Marca y destacados, previstos en el documento histórico, no forman parte de lo demostrado.","transition":"Facundo toma ese producto y explica el carrito del cliente.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",2],["Documentacion/Documentación de API.pdf",6],["Documentacion/Documentación de API.pdf",7],["Documentacion/Documentación de API.pdf",8]],"cue":"60 s de demostración y 75 s de explicación. Captura real disponible de catálogo.","presenter":"Daiana","seconds":135,"start":435,"end":570,"number":8},{"title":"Carrito del cliente","case":3,"say":"Este flujo se apoya en RF3 y en las rutas actuales de la API. Desde Detalle.cshtml, el formulario llama a CarritoController.Agregar. MVC exige autenticación y valida antiforgery. CarritosApiService transforma las acciones en POST, PATCH o DELETE y el handler adjunta Bearer. El endpoint obtiene el usuario desde su identidad autenticada, no desde un campo editable. CarritosLogica busca o crea el carrito activo y aplica reglas: cantidad positiva, stock suficiente y precio consultado en el servidor. Agregar otra vez el mismo producto consolida cantidades. Algunas escrituras acceden directamente a TotaltechDbContext y usan una transacción serializable en bases relacionales. No corresponde dibujar un repositorio intermedio que aquí no se usa. CrearResumenAsync devuelve líneas y totales; el controlador redirige a Index y CarritoViewModel.Desde prepara la vista. Si no hay líneas, se muestra el estado vacío. Agregar al carrito no reserva ni descuenta stock. La cantidad excesiva se rechaza con conflicto.","transition":"Daiana cambia al rol administrador para mantener la oferta del catálogo.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",5],["Documentacion/Documentación de API.pdf",9]],"cue":"60 s de demostración y 75 s de código. Respaldo: diagrama, sin fingir captura de carrito.","presenter":"Facundo","seconds":135,"start":570,"end":705,"number":9},{"title":"Administración de productos","case":4,"say":"La administración implementa las operaciones elegidas de RF1 y UC-19. ProductosController coordina Crear, Editar y Eliminar, y ProductosApiService llama los endpoints protegidos. Para crear, la lógica valida datos y relaciones con categoría y proveedor. En edición, el archivo llega a ProductoImagenStorage.GuardarAsync. Se verifican extensión, MIME, firma y tamaño máximo de cinco megabytes. El archivo se guarda en uploads/productos y se envía su URL junto con los datos al PUT de producto. SQL Server conserva la URL, no los bytes de la imagen. Si no se selecciona otro archivo se conserva la anterior. Para eliminar usamos un producto de demostración sin relaciones. La base de datos rechaza la eliminación con relaciones; el endpoint convierte DbUpdateException en 409 y MVC explica el motivo. El éxito devuelve 204. El documento histórico propone baja lógica y auditoría; el código actual elimina físicamente cuando las relaciones lo permiten. Esa diferencia delimita el alcance de la entrega.","transition":"Facundo reúne los recorridos en una sola solicitud de ida y vuelta.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Casos de Uso- Totaltech.pdf",3],["Documentacion/Casos de Uso- Totaltech.pdf",5],["Documentacion/Documentación de API.pdf",7],["Documentacion/Documentación de API.pdf",8]],"cue":"70 s de demostración y 80 s de explicación. Captura real disponible de edición.","presenter":"Daiana","seconds":150,"start":705,"end":855,"number":10},{"title":"Recorrido de una solicitud","say":"Tomemos la búsqueda del catálogo como ejemplo completo. El navegador envía los filtros definidos por la vista Razor al controlador MVC. El controlador coordina la operación y delega la comunicación en ProductosApiService. El cliente HTTP llama al endpoint de productos. El endpoint recibe el contrato y la lógica valida las reglas antes de consultar el repositorio. El repositorio utiliza Entity Framework y TotaltechDbContext para llegar a SQL Server. La respuesta vuelve por esas capas: los resultados se proyectan en un DTO, la API lo serializa como JSON, el servicio del frontend lo deserializa y MVC construye el modelo de pantalla. Finalmente Razor produce el HTML que recibe el navegador. Esta separación permite ubicar una falla: validación de pantalla, comunicación, regla de negocio o persistencia. Hay dos particularidades que vimos: registro y login llaman directamente a IHttpClientFactory desde HomeController; algunas escrituras del carrito usan DbContext dentro de la lógica. El diagrama general no elimina esas diferencias. Las dependencias se registran en Program.cs y el navegador nunca consulta directamente SQL Server.","transition":"Daiana explica los criterios de calidad que acompañan estos recorridos.","sources":[["Documentacion/Documentación de API.pdf",36]],"cue":"105 s. Seguir ida de izquierda a derecha y vuelta en sentido inverso. Abrir HTML solo si ya está preparado.","presenter":"Facundo","seconds":105,"start":855,"end":960,"number":11},{"title":"Cinco criterios de calidad","say":"Los requisitos no funcionales indican cómo debe comportarse el sistema. Seguridad se refleja en hash, JWT, permisos, propiedad del carrito y protección CSRF de formularios. Esto acredita controles concretos, no una certificación general. Rendimiento se contempla con paginación y proyecciones: la evidencia histórica mide cargas locales de catálogo y detalle bajo tres segundos, sin probar capacidad concurrente en producción. Usabilidad aparece en validaciones por campo, mensajes claros, confirmaciones y estados vacíos. Compatibilidad tiene evidencia automatizada en Chromium con anchos de 320, 375, 425, 768, 1024 y 1280 píxeles. Firefox y Edge siguen siendo objetivos del documento, sin afirmar aquí que se verificaron. Mantenibilidad se apoya en responsabilidades, inyección de dependencias y pruebas. Reconocemos la excepción del carrito con DbContext directo. Cada criterio se presenta con su evidencia y su alcance, evitando equiparar una intención documental con una garantía ya comprobada.","transition":"Facundo presenta el balance de la entrega y las prioridades siguientes.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",9]],"cue":"18 s por criterio. El listado conserva los números oficiales RNF4, RNF1, RNF2, RNF3 y RNF5.","presenter":"Daiana","seconds":90,"start":960,"end":1050,"number":12},{"title":"Estado del proyecto y próximos pasos","say":"El balance de esta entrega es un conjunto de cinco recorridos trazables entre requisitos, pantallas y código. Como antecedente conservamos el reporte de 105 pruebas aprobadas comunicado en la preparación del primero de octubre: ocho unitarias, setenta y ocho de integración y frontend, y diecinueve E2E. La cifra procede del material anterior y no representa una ejecución nueva. Las pruebas actuales del repositorio permiten localizar escenarios de registro, credenciales, catálogo, carrito, imágenes y eliminación restringida. También muestran cómo tratar errores: 400 para datos inválidos, 401 para credenciales, 403 para permisos, 404 para recursos inexistentes y 409 para conflictos. Desde la gestión del proyecto, el primer paso siguiente es completar el checkout MVC y verificar su integración con pedidos y pagos. El segundo es cerrar la recuperación de contraseña con envío y restablecimiento real, además de conectar contacto y garantía. El tercero es alinear la documentación de casos de uso con el carrito y definir la baja lógica y auditoría previstas. El criterio de cierre de cada hito será un recorrido completo desde la pantalla hasta su resultado y una prueba reproducible. No asignamos fechas ni porcentajes de avance sin una estimación validada.","transition":"Daiana cierra con el resultado que puede mostrar el equipo.","sources":[["Documentacion/Documentación de API.pdf",35],["Documentacion/Documentación de API.pdf",36]],"cue":"40 s de evidencia histórica, 30 s de errores y 50 s de prioridades. No decir que las 105 se ejecutaron hoy.","presenter":"Facundo","seconds":120,"start":1050,"end":1170,"number":13},{"title":"Resultado de la entrega","say":"TotalTech permite que un cliente cree su cuenta, acceda, encuentre productos y organice su carrito, mientras el administrador mantiene la oferta. Mostramos cómo esas acciones se relacionan con los requisitos y cómo recorren el código hasta volver a la pantalla. La entrega tiene un alcance verificable y próximos pasos definidos. Muchas gracias.","transition":"Cierre a 20:00. Preguntas fuera del bloque cronometrado.","sources":[["Documentacion/Documentación - Grupo 1 -TotalTech.pdf",8],["Documentacion/Documentación de API.pdf",36]],"cue":"30 s. No iniciar una nueva demostración.","presenter":"Daiana","seconds":30,"start":1170,"end":1200,"number":14}]};
  const root=document.getElementById('tt-proyecto');
  const el=id=>root.querySelector('#'+id);
  const choice=el('tt-case'),back=el('tt-prev'),next=el('tt-next');
  const start=el('tt-start'),pause=el('tt-pause'),reset=el('tt-reset');
  let chosen=0,step=0,elapsed=0,anchor=0,running=false,lastSaved='';
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  const current=()=>Math.min(1200,elapsed+(running?(performance.now()-anchor)/1000:0));
  function save(){const privateContent={chosen,step,elapsed:current()};lastSaved=JSON.stringify(privateContent);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{escenario:data.cases[chosen].name,etapa:data.cases[chosen].steps[step][0]},privateContent}).catch(()=>{});}
  function restore(v){const s=v?.privateContent;if(!s||JSON.stringify(s)===lastSaved)return;chosen=Number.isInteger(s.chosen)&&s.chosen>=0&&s.chosen<5?s.chosen:0;step=Number.isInteger(s.step)&&s.step>=0&&s.step<6?s.step:0;elapsed=Number.isFinite(s.elapsed)?Math.max(0,Math.min(1200,s.elapsed)):0;running=false;render();tick();}
  function render(){const c=data.cases[chosen],st=c.steps[step],src=c.sources[step];choice.value=String(chosen);el('tt-ref').textContent=c.ref+' · '+c.actor;el('tt-stage').textContent=st[1];el('tt-explain').textContent=st[2];el('tt-file').textContent=src.path;el('tt-code').textContent=src.code;el('tt-source').hidden=!src.code;el('tt-step').textContent=(step+1)+' / 6';back.disabled=step===0;next.disabled=step===5;root.querySelectorAll('.tt-flow li').forEach((li,i)=>{if(i===step)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');});}
  function tick(){let sec=current();if(sec>=1200){elapsed=1200;running=false;}el('tt-time').textContent=fmt(Math.ceil(1200-sec));const slot=data.slides.find(s=>sec<s.end);const label=slot?`${slot.number}. ${slot.title} · ${slot.presenter} · ${fmt(slot.start)}–${fmt(slot.end)}`:'20:00 · Exposición finalizada';if(el('tt-slot').textContent!==label)el('tt-slot').textContent=label;start.disabled=running||sec>=1200;pause.disabled=!running;start.textContent=sec>0?'Continuar':'Iniciar';}
  choice.addEventListener('change',()=>{chosen=Number(choice.value);step=0;render();save();});
  back.addEventListener('click',()=>{step=Math.max(0,step-1);render();save();});
  next.addEventListener('click',()=>{step=Math.min(5,step+1);render();save();});
  start.addEventListener('click',()=>{if(running||elapsed>=1200)return;anchor=performance.now();running=true;tick();save();});
  pause.addEventListener('click',()=>{elapsed=current();running=false;tick();save();});
  reset.addEventListener('click',()=>{elapsed=0;running=false;tick();save();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  render();restore(window.openai?.widgetState);tick();setInterval(tick,250);
})();
</script>
</main></body></html>
