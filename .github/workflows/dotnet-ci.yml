name: TotalTech .NET CI

on:
  push:
    branches: [main, Develop, Rama--Facu]
  pull_request:
    branches: [main, Develop]

permissions:
  contents: read

env:
  SOLUTION: Grupo-N-1---SistemaVentaDeProductosTecnologicos.sln
  INTEGRATION_TEST_PROJECT: Tests/Totaltech.IntegrationTests/Totaltech.IntegrationTests.csproj

jobs:
  prometheus-validation:
    name: Prometheus configuration and alert tests
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify Prometheus
        shell: pwsh
        run: |
          $version = '3.15.0'
          $archive = "prometheus-$version.windows-amd64.zip"
          $release = "https://github.com/prometheus/prometheus/releases/download/v$version"
          $directory = Join-Path $env:RUNNER_TEMP 'totaltech-prometheus'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archivePath = Join-Path $directory $archive
          $checksumsPath = Join-Path $directory 'sha256sums.txt'
          Invoke-WebRequest -Uri "$release/$archive" -OutFile $archivePath
          Invoke-WebRequest -Uri "$release/sha256sums.txt" -OutFile $checksumsPath
          $escapedArchive = [regex]::Escape($archive)
          $entry = @(Get-Content -LiteralPath $checksumsPath | Where-Object { $_ -match "^[a-fA-F0-9]{64}\s+\*?$escapedArchive$" })
          if ($entry.Count -ne 1) { throw 'No se encontró un checksum oficial único para el ZIP.' }
          $expected = ($entry[0] -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'El checksum SHA256 de Prometheus no coincide.' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $directory
          $promtool = Join-Path $directory "prometheus-$version.windows-amd64/promtool.exe"
          "PROMTOOL=$promtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate configuration, rules and scenarios
        shell: pwsh
        run: |
          & $env:PROMTOOL check config Observabilidad/prometheus.yml
          if ($LASTEXITCODE -ne 0) { throw 'Configuración Prometheus inválida.' }
          & $env:PROMTOOL check rules Observabilidad/alertas.yml
          if ($LASTEXITCODE -ne 0) { throw 'Reglas Prometheus inválidas.' }
          & $env:PROMTOOL test rules Observabilidad/tests/alertas.test.yml
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas de alertas fallidas.' }

  fast-tests:
    name: Build and fast tests
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Run fast tests
        run: dotnet test $env:SOLUTION --configuration Release --no-build --no-restore --filter "Category!=SqlServer&Category!=E2E"

  sqlserver-relational:
    name: SQL Server relational tests
    needs: fast-tests
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify and start LocalDB
        shell: pwsh
        run: |
          $localDb = Get-Command SqlLocalDB.exe -ErrorAction Stop
          & $localDb.Source start MSSQLLocalDB
          & $localDb.Source info MSSQLLocalDB

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Run SQL Server relational tests
        run: dotnet test $env:INTEGRATION_TEST_PROJECT --configuration Release --no-build --no-restore --filter "Category=SqlServer"

  catalog-e2e:
    name: Catalog browser E2E
    needs: [fast-tests, sqlserver-relational]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start LocalDB
        shell: pwsh
        run: SqlLocalDB.exe start MSSQLLocalDB
      - run: dotnet restore $env:SOLUTION
      - run: dotnet build $env:SOLUTION --configuration Release --no-restore
      - name: Install Chromium
        shell: pwsh
        run: pwsh Tests/Totaltech.IntegrationTests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Run catalog E2E
        run: dotnet test $env:INTEGRATION_TEST_PROJECT --configuration Release --no-build --no-restore --filter "Category=E2E"
